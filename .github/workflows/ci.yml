name: brand

on:
  # Branches only. A tag push re-ran this whole workflow alongside release.yml,
  # which rebuilds and gates the same tree, so the tag got two identical
  # verdicts and twice the runner minutes.
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: build · gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # `npm ci` needs the lockfile, and the lockfile is committed for the
          # same reason dist/ is: a build that resolves differently on a
          # different day is not a build.
          cache: npm
      - run: npm ci
      # The build runs first because every gate reads dist/, and check-dist-clean
      # then rebuilds and asks git whether anything moved. A file edited by hand
      # in dist/ fails there rather than reaching a business card.
      - run: npm run tokens
      - run: npm run build
      - run: npm run docs
      - run: npm run gates
      # Regenerating and finding nothing moved is the whole contract: the
      # tokens, the assets and the guidelines are all output, and none of them
      # is edited by hand.
      - run: git diff --exit-code -- dist docs brand/tokens
